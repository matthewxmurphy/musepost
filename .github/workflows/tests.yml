name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q musepost musepost_mail.py musepost_config.py musepost_state.py tests
      - name: Check installer syntax
        run: sh -n install.sh
      - name: Run fake-transport tests
        run: python -m unittest discover -s tests -v
      - name: Check installed CLI without mail credentials
        run: |
          sh install.sh "$RUNNER_TEMP/musepost install"
          "$RUNNER_TEMP/musepost install/bin/musepost" --help
          "$RUNNER_TEMP/musepost install/bin/musepost" --version
